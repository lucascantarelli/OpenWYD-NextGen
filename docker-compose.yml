# WYD — stack base (SEM portas publicadas, SEM volumes de dev).
# Padrão: `docker compose up` lê este arquivo + `docker-compose.override.yml`
# (dev, automático). Produção: `docker compose -f docker-compose.yml
# -f docker-compose.prod.yml up -d` (o override de dev NÃO é carregado).
# Imagens locais:  wyd/<servico>:${TAG:-dev}   Containers: wyd-<servico>
# Serviços = binários Rust que existem (serviço = container = imagem).
# Exceções (infraestrutura, não binário de jogo): `mkdocs` é documentação interna
# (imagem oficial) para dev/admin e não fala com o DB; `prometheus`, `alertmanager`,
# `alert-sink`, `blackbox-exporter`, `grafana`, `loki`, `alloy` e `node-exporter` são a
# cadeia de observabilidade/notificação — o `alert-sink` é o receptor local do
# Alertmanager e o único deles com código do projeto (`tools/dev/alert-sink.mjs`).
# Mapa completo (crates → deployáveis, observabilidade, pendências por issue)
# em `docs/rust/05-stack-docker.md`. Só entra no compose o serviço cujo
# binário existe; o resto está mapeado e bloqueado pela issue dona.
# Prometheus/Grafana/Node Exporter sobem no MESMO `up` (monitoramento é parte da
# stack, não um extra: a aba /monitoramento do portal depende deles).

# Rede/volume fixos `wyd_*` (mesmo padrão do arquivado `openwyd_*`).
name: ${COMPOSE_PROJECT_NAME:-wyd}

# Teto de log e privilégio mínimo (DEVOPS-03): âncoras aplicadas serviço a serviço.
# `json-file` com max-size/max-file evita que um laço de erro encha o disco do host;
# `no-new-privileges` impede escalada por setuid dentro do container.
x-log-teto: &log-teto
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-seguranca: &seguranca
  - no-new-privileges:true

services:
  db:
    logging: *log-teto
    security_opt: *seguranca
    # Serviço de dados: imagem oficial, sem Dockerfile próprio (padrão da
    # indústria). Schema via `crates/wyd-db/migrations/` (FASE-04); sem
    # one-shot de roles no stack novo — o Postgres sobe com o superusuário
    # de dev. NÃO usar assim em produção.
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wyd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-wyd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `-d` é obrigatório: sem ele o `pg_isready` tenta o banco de mesmo nome do usuário
      # (com `POSTGRES_USER=admin` o log enchia com `FATAL: database "admin" does not exist`
      # a cada 10 s, mesmo com o Postgres pronto).
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wyd} -d ${POSTGRES_DB:-wyd}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wyd

  gateway:
    logging: *log-teto
    security_opt: *seguranca
    # Gateway HTTP/JSON do Cold Path (ADR-0022, WEB-01) — o upstream real do
    # portal em `:7600`. `GET /health` consulta o Postgres (SELECT 1) e só então
    # devolve 200; `GET /metrics` publica wyd_gateway_requests_total/uptime.
    # Imagem distroless: o healthcheck é o próprio binário (`--healthcheck`).
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: wyd/gateway:${TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 0.0.0.0 = interface do container (não é exposição no host: base não
      # publica portas; quem publica é o override de dev, em loopback).
      WYD_GATEWAY_BIND: 0.0.0.0:7600
      DATABASE_URL: "postgres://${POSTGRES_USER:-wyd}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-wyd}"
      WEB_API_TOKEN: ${WEB_API_TOKEN:?defina WEB_API_TOKEN no .env (portal -> gateway)}
      # CPSock do canal de jogo: a troca de PIN do portal abre uma conexão real e
      # faz o `0x0FDE` em duas etapas (nada de hash escrito pelo gateway).
      WYD_GAME_ADDR: ${WYD_GAME_ADDR:-wyd-canal-1:8281}
      # Seed da conta de staff roda em todo boot do gateway (idempotente), não
      # num container one-shot: com `PORTAL_ADMIN_PASSWORD` definida ele
      # reconcilia o hash do banco; `WYD_SEED_STAFF=1` só exige a presença.
      WYD_SEED_STAFF: ${WYD_SEED_STAFF:-0}
      PORTAL_ADMIN_USER: ${PORTAL_ADMIN_USER:-admin}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/usr/local/bin/wyd-gateway", "--healthcheck" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - wyd

  server-canal-1:
    security_opt: *seguranca
    # Monólito de jogo — UM container POR CANAL (ADR-0022 §7). Mesma imagem, mesmo
    # Postgres, canais diferentes: `WYD_SERVER_CHANNEL` + o IP publicado no override.
    # `wyd-canal-1` é o canal normal; `wyd-canal-2` (verde) entra no override de dev
    # com IP próprio, porque o cliente disca 8281 fixo no host da célula do .bin.
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: wyd/server:${TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-wyd}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-wyd}"
      WYD_SERVER_CHANNEL: "1"
      WYD_SERVER_CPSOCK_BIND: 0.0.0.0:8281
      WYD_SERVER_STATUS_BIND: 0.0.0.0:8080
      WYD_SERVER_METRICS_BIND: 0.0.0.0:9898
      # Lotação/manutenção do canal (QA-06): vazio = vale o banco
      # (`channel_capacity`, migration 0040). Teto em sessões vivas; manutenção
      # (`1`/`true`/`yes`/`on`) recusa entrada nova sem derrubar sessão viva.
      WYD_SERVER_MAX_PLAYERS: ""
      WYD_SERVER_MAINTENANCE: ""
      # Papel do canal (GAME-10): vazio = vale o banco (`channel_role`, migration
      # 0041). `normal`/`verde` sobrescreve por processo — o build é o mesmo.
      WYD_SERVER_CHANNEL_ROLE: ""
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/usr/local/bin/wyd-server", "--healthcheck" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    # Retenção do stdout (json-file): o login manual do jogador precisa sobreviver a
    # rotação. Recriar o container (`up -d` que troca a imagem) ainda abre um stream novo —
    # auditoria de longo prazo exige exportar para fora da máquina; aqui o mínimo é não
    # perder a janela recente por tamanho.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - wyd

  server-canal-2:
    security_opt: *seguranca
    # Canal 2 (verde/novato): MESMA imagem e MESMO banco, outro IP — o cliente só
    # diferencia canal por host, nunca por porta (`docs/cliente/formatos.md` §4).
    image: wyd/server:${TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-wyd}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-wyd}"
      WYD_SERVER_CHANNEL: "2"
      WYD_SERVER_CPSOCK_BIND: 0.0.0.0:8281
      WYD_SERVER_STATUS_BIND: 0.0.0.0:8080
      WYD_SERVER_METRICS_BIND: 0.0.0.0:9898
      # Lotação/manutenção do canal (QA-06): vazio = vale o banco.
      WYD_SERVER_MAX_PLAYERS: ""
      WYD_SERVER_MAINTENANCE: ""
      # Papel do canal (GAME-10): vazio = vale o banco (`channel_role`, 0041).
      WYD_SERVER_CHANNEL_ROLE: ""
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/usr/local/bin/wyd-server", "--healthcheck" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    # Mesma retenção do canal 1: o login manual deste canal não some por rotação.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - wyd

  portal:
    logging: *log-teto
    security_opt: *seguranca
    # Serviço web: Dockerfile próprio (multi-stage, non-root, standalone).
    # O portal NUNCA fala SQL (invariante 7 do AGENTS.md): BFF puro sobre o
    # gateway Rust (`gateway:7600`, ADR-0022). /api/health chama
    # item_catalog/list_items e devolve 200 com a contagem real do catálogo;
    # 502 é backend ausente, não bug do compose.
    build:
      context: .
      dockerfile: docker/Dockerfile.portal
    image: wyd/portal:${TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      # DNS interno do compose (NUNCA 127.0.0.1: dentro do container o
      # loopback é ele mesmo). Fixo de propósito: o `WEB_API_ADDR` do `.env` vale
      # para rodar o portal no host (`npm run dev`), não para o container.
      WEB_API_ADDR: http://gateway:7600
      # Token processo→processo (ADR-0022 §2); o browser nunca o vê.
      WEB_API_TOKEN: ${WEB_API_TOKEN:?defina WEB_API_TOKEN no .env (portal -> gateway)}
      AUDIT_LOG_DIR: ${AUDIT_LOG_DIR:-/var/log/wyd-portal}
      # Observabilidade: o browser nunca fala com Prometheus/Loki. O BFF lê os
      # dois server-side e só o Grafana é embedado (iframe em loopback).
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://127.0.0.1:3001}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - wyd

  mkdocs:
    logging: *log-teto
    security_opt: *seguranca
    # Documentação interna de dev/admin (não é documentação pública do jogador).
    # A imagem oficial já traz MkDocs + Material; não há Dockerfile próprio.
    # Monte somente o necessário: `mkdocs.yml` e `docs/` ficam read-only.
    # O público jogador será publicado pelo portal; aqui não há perfis/auth.
    image: squidfunk/mkdocs-material:9.8.0
    restart: unless-stopped
    working_dir: /docs
    command: [ "serve", "-a", "0.0.0.0:8000" ]
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./docs:/docs/docs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - wyd

  prometheus:
    logging: *log-teto
    security_opt: *seguranca
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    # `--web.enable-lifecycle` (reload por HTTP sem auth) vive SÓ no override de dev:
    # em produção não há porta publicada, mas o endpoint não precisa existir.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - wyd

  alertmanager:
    security_opt: *seguranca
    # Elo que faltava (DEVOPS-02): sem ele, regra em `firing` não avisa ninguém.
    # Rota, agrupamento, repetição e silêncio vivem em
    # `docker/monitoring/alertmanager/alertmanager.yml`; o receiver é o
    # `alert-sink` (destino local verificável) e deve ser trocado pelo destino real
    # (e-mail/Slack/webhook) quando existir.
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    # Render mínimo no boot (nenhum segredo em arquivo versionado): escolhe o destino
    # real (`ALERTMANAGER_DESTINO`, default `slack`) e materializa os segredos vindos do
    # ambiente em /tmp/wyd-secrets. Sem `SLACK_API_URL`, a integração Slack faz
    # bootstrap para o `alert-sink` — o build não quebra e a notificação fica registrada;
    # definida a URL real, a entrega passa a ser no Slack sem tocar em rota/inibição.
    entrypoint: [ "/bin/sh", "/etc/alertmanager/render-config.sh" ]
    environment:
      # Destino real da notificação: `slack` (default) ou `email`.
      ALERTMANAGER_DESTINO: ${ALERTMANAGER_DESTINO:-slack}
      # Segredos: vêm do .env do host. Nunca neste arquivo nem na imagem.
      SLACK_API_URL: ${SLACK_API_URL:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#wyd-alertas}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./docker/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - alert-sink
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - wyd

  alert-sink:
    security_opt: *seguranca
    # Receptor LOCAL de prova (DEVOPS-02) — NÃO é o destino de operação: a rota padrão
    # vai para `slack`/`email`. Ele recebe (a) o caminho de prova `prova=local` de
    # `make monitoring-alertas` e (b) o bootstrap da integração Slack enquanto não houver
    # `SLACK_API_URL` — cada notificação vira uma linha JSON em
    # `/var/log/wyd-alerts/alertas.jsonl` (volume `alerts-out`). Sem porta no host.
    image: node:24-alpine
    restart: unless-stopped
    command: [ "node", "/app/alert-sink.mjs" ]
    environment:
      ALERT_SINK_PORT: "9099"
      ALERT_SINK_DIR: /var/log/wyd-alerts
    volumes:
      - ./tools/dev/alert-sink.mjs:/app/alert-sink.mjs:ro
      - alerts-out:/var/log/wyd-alerts
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9099/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - wyd

  blackbox-exporter:
    security_opt: *seguranca
    # Sonda ativa do portal (DEVOPS-02): o BFF não publica `/metrics`, então a
    # disponibilidade vem de `http_2xx` em `/api/health`. Só consultado pelo Prometheus.
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: [ "--config.file=/etc/blackbox/blackbox.yml" ]
    volumes:
      - ./docker/monitoring/blackbox:/etc/blackbox:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:9115/metrics || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - wyd

  grafana:
    logging: *log-teto
    security_opt: *seguranca
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-troque-aqui-dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # A área de admin do portal embute dashboards em iframe (`/monitoramento`).
      # O Grafana escuta SÓ em loopback (127.0.0.1:3001): o acesso anônimo é
      # somente leitura e serve apenas a esse embed — nunca o exponha em rede.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - wyd

  loki:
    logging: *log-teto
    security_opt: *seguranca
    # Logs duráveis da stack. O Docker guarda stdout por container (`json-file`),
    # então recriar container perde o stream; aqui o histórico fica em volume
    # nomeado com retenção de 14 d (`docker/monitoring/loki/loki.yml`). Sem porta no
    # host: só o portal (server-side) e o Grafana consultam.
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - ./docker/monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      - wyd

  alloy:
    logging: *log-teto
    security_opt: *seguranca
    # Coletor oficial da Grafana: lê o stdout de TODOS os containers pelo socket
    # (read-only) e empurra para o Loki. Não há serviço de log caseiro: o portal
    # consulta o Loki, nunca o Docker.
    image: grafana/alloy:v1.9.2
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./docker/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - wyd

  node-exporter:
    logging: *log-teto
    security_opt: *seguranca
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - wyd
networks:
  wyd:
    name: wyd
    driver: bridge

volumes:
  pgdata:
    name: wyd-pgdata
  prometheus-data:
    name: wyd-prometheus-data
  alertmanager-data:
    name: wyd-alertmanager-data
  alerts-out:
    name: wyd-alerts-out
  grafana-data:
    name: wyd-grafana-data
  loki-data:
    name: wyd-loki-data
  alloy-data:
    name: wyd-alloy-data
