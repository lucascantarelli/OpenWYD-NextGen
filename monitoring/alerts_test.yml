# Testes de unidade das regras (promtool), sem Prometheus rodando:
#
#   docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool \
#     prom/prometheus:latest test rules /m/alerts_test.yml
#
# Cada caso simula a condição e prova que o alerta dispara; os casos "ok" provam
# que ele NÃO dispara quando a causa some.
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # 1. Fila de entrega: 0 -> 80 linhas. Dispara depois de 2 min acima do limite.
  - interval: 1m
    input_series:
      - series: 'delivery_queue_rows{service="dbserver"}'
        values: '0 0 0 80 80 80'
    alert_rule_test:
      - eval_time: 2m
        alertname: DeliveryQueueBacklog
        exp_alerts: []
      - eval_time: 6m
        alertname: DeliveryQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              service: dbserver
            exp_annotations:
              summary: "Fila de entrega da web com 80 linhas presas"
              description: "delivery_queue não drena há 2 min; verifique o tmServer e os grants pendentes (docs/migration/web-platform-plan.md)."

  # 2. RPC: ~2% de erro sustentado dispara; 0% não.
  - interval: 1m
    input_series:
      - series: 'grpc_requests_total{service="webserver",method="/web.v1.AdminService/List",code="OK"}'
        values: '0 99 198 297 396 495'
      - series: 'grpc_requests_total{service="webserver",method="/web.v1.AdminService/List",code="Unavailable"}'
        values: '0 2 4 6 8 10'
    alert_rule_test:
      - eval_time: 6m
        alertname: GRPCErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "RPC com erro acima de 1%"
              description: "Falha de transporte/handler no web-api, dbServer ou binServer; o trace_id da linha de log correlaciona a requisição."

  - interval: 1m
    input_series:
      - series: 'grpc_requests_total{service="webserver",method="/web.v1.AdminService/List",code="OK"}'
        values: '0 100 200 300 400 500'
    alert_rule_test:
      - eval_time: 6m
        alertname: GRPCErrorRate
        exp_alerts: []

  # 3. Mundo sem tick: timestamp congelado em 0 enquanto time() avança.
  - interval: 1m
    input_series:
      - series: 'world_tick_timestamp_seconds{service="tmserver"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: WorldTickStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              service: tmserver
            exp_annotations:
              summary: "Mundo sem tick em tmserver"
              description: "O loop do jogo parou de avançar (world.World.Run). Verifique o log do tmServer pelo trace_id da última requisição."

  # O caso saudável: o timestamp acompanha o relógio, então a diferença é 0.
  - interval: 1m
    input_series:
      - series: 'world_tick_timestamp_seconds{service="tmserver"}'
        values: '0 60 120 180 240'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorldTickStalled
        exp_alerts: []

  # 4. Disco: 5% livre dispara; 50% não.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/",device="/dev/sda1",fstype="ext4"}'
        values: '5 5 5 5'
      - series: 'node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/",device="/dev/sda1",fstype="ext4"}'
        values: '100 100 100 100'
    alert_rule_test:
      - eval_time: 4m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: "node-exporter:9100"
              mountpoint: "/"
            exp_annotations:
              summary: "Disco com menos de 10% livre em /"
              description: "Libere espaço antes que o Postgres pare de escrever; em Docker Desktop isto mede a VM do Docker, não o volume do Windows."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/",device="/dev/sda1",fstype="ext4"}'
        values: '50 50 50 50'
      - series: 'node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/",device="/dev/sda1",fstype="ext4"}'
        values: '100 100 100 100'
    alert_rule_test:
      - eval_time: 4m
        alertname: DiskSpaceLow
        exp_alerts: []
