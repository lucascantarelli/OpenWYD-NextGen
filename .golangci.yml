# Configuração do golangci-lint v2 (guidelines §25). O conjunto padrão da v2 já
# liga errcheck/govet/ineffassign/staticcheck/unused; aqui entram revive/misspell/
# unconvert por cima e gofmt/goimports como formatadores. O CI barra apenas
# problema *novo* (only-new-issues), para a dívida antiga não travar o build; rode
# `golangci-lint run` local para o retrato completo. Regenere com
# `golangci-lint migrate` ao subir a versão.
version: "2"
linters:
  enable:
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      ignore-rules:
        # O protocolo legado realmente escreve assim (_MSG_Challange.cpp);
        # handlers e comentários espelham esse nome por paridade.
        - challange
        # O arquivo da ferramenta GM legada se chama mesmo "Comandos GM.txt",
        # citado ao pé da letra como fonte de evidência.
        - comandos
        # Texto de cliente copiado de Language.txt (_NN_Night_Already,
        # "Quest em progresso.").
        - progresso
        # Nome de item legado "Pedras Secretas" (5334–5337, ItemList.csv), citado
        # ao pé da letra nos handlers de King/Pedra Ideal/Pedra da Fúria.
        - secretas
        # Texto de cliente copiado de Language.txt (_NN_Cant_with_armor,
        # "No momento você não pode equipar arma e armadura.").
        - momento
        # Palavras portuguesas que o dicionário inglês do misspell não conhece.
        # Sem estas entradas o lint acusa português correto como erro; nenhuma
        # regra do misspell é desligada.
        - substituto
        - persistente
        - comando
        - convers
        - eles
        - independente
        - controles
        - rela
        - posicional
        - editores
        - processos
        - correlacion
        - precisou
        - validade
        - correspondente
        - balanceada
        - presentes
        - variantes
        - alternativos
        - clientes
        - devolvendo
        - duplicatas
        - alternar
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
          - staticcheck
        path: \.pb\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
