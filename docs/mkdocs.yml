# Site de documentação — config dentro de docs/, junto com o conteúdo.
#
# `docs_dir: .` porque este arquivo está na raiz do próprio conteúdo. `site_dir`
# fica FORA de docs_dir (o mkdocs recusa aninhar build no conteúdo) e já está no
# .gitignore.
#
# ## Identidade visual
#
# A paleta e o raio vêm de `portal/src/app/globals.css` (`:root`), replicados em
# `assets/portal-theme.css`. O Material expõe as cores por variável CSS
# (`--md-*`), então o override é declarativo e sobrevive a upgrade de tema.
#
# ## Plugins
#
# Só os **built-in** do Material (`search`), que já vêm na imagem
# `squidfunk/mkdocs-material` — nada instala no build:
#   https://squidfunk.github.io/mkdocs-material/plugins/search/
# O plugin `social` (cards por página) também é built-in, mas exige renderização
# de imagem por página e deixa o build ~10x mais lento; fica de fora até existir
# conteúdo suficiente para justificar.
#
# ## Como rodar
#
#   docker compose --profile docs up mkdocs      # http://localhost:8000
#   docker compose --profile docs run --rm mkdocs build -f docs/mkdocs.yml --strict

site_name: OpenWYD — documentação
site_description: Servidor local de WYD2 em Go, portal Next.js e cliente Windows
docs_dir: .
site_dir: ../site
use_directory_urls: true
copyright: OpenWYD — servidor local de WYD2

theme:
  name: material
  language: pt-BR
  # Tipografia do portal (ui-sans-serif/Segoe UI), não Roboto.
  font: false
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    scheme: slate
    primary: black
    accent: amber

extra_css:
  - assets/portal-theme.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Guias:
      - Visão geral: guias/index.md
      - Jogador:
          - Primeiros passos: guias/usuario/comecando.md
          - Comandos e utilidades: guias/usuario/comandos.md
      - Administração:
          - Portal e papéis: guias/admin/portal.md
  - Sistemas de jogo:
      - Índice: sistemas/README.md
      - Personagem e evolução: sistemas/personagem.md
      - Combate e dano: sistemas/combate.md
      - Skills e afects: sistemas/skills.md
      - Drops: sistemas/drops.md
      - Refino e combine: sistemas/refino.md
      - Quests e diária: sistemas/quests.md
      - Comércio e loja: sistemas/comercio.md
      - Guildas: sistemas/guildas.md
      - Castelos, Kefra e torre: sistemas/castelos.md
      - Eventos globais: sistemas/eventos.md
      - Canais e troca: sistemas/canais.md
      - Mapa e teleporte: sistemas/mapa.md
  - História, guerras e reinos:
      - História: lore/historia.md
      - Guerras: lore/guerras.md
      - Reinos e cidades: lore/reinos.md
  - Primeiros passos (técnico):
      - Sessão atual: migration/SESSION-PRIMER.md
      - Índice da migração: migration/README.md
      - Glossário: migration/glossary.md
  - Arquitetura:
      - Visão de conjunto: analysis/README.md
      - Estado atual: analysis/estado-atual.md
      - Fluxos ponta a ponta: migration/flows.md
      - Topologia, portas e configs: migration/config-ops.md
      - Modelo de domínio: migration/domain-model.md
  - Protocolo e formatos:
      - CPSock e structs: migration/protocol-spec.md
      - Formatos de save: migration/data-formats.md
      - Canais e serverlist: migration/canais.md
  - Regras de jogo:
      - Fórmulas: migration/game-rules.md
      - Comandos in-game: game.md
      - Bugs conhecidos: migration/ingame-bugs.md
  - Handlers:
      - Contratos: migration/handlers/README.md
  - Banco de dados:
      - Auditoria do schema: analysis/banco-de-dados.md
      - Persistência de conteúdo: analysis/persistencia-conteudo.md
  - Portal:
      - Papéis e rotas: analysis/portal-papeis.md
      - NPCs no Next.js: integrations/npc-admin-nextjs.md
      - Faturamento: integrations/faturamento-nextjs.md
  - Cliente:
      - Visão do cliente: client.md
      - Launcher: analysis/cliente-launcher.md
      - Plano do launcher: launcher-plan.md
      - Hooks do patch: migration/client-patch-hooks.md
  - Operação:
      - Deploy de 05/11: analysis/deploy-2026-11-05.md
      - Qualidade e processo: analysis/qualidade-e-processo.md
      - QA in-game: analysis/qa-ingame.md
  - ADRs:
      - Índice: adr/README.md
      - 0001 Go no servidor: adr/0001-go-no-servidor.md
      - 0002 Goroutine única do mundo: adr/0002-goroutine-unica-do-mundo.md
      - 0003 Portal como BFF: adr/0003-portal-bff.md
      - 0004 Banco como fonte de conteúdo: adr/0004-banco-fonte-de-conteudo.md
      - 0005 delivery_queue: adr/0005-delivery-queue.md
      - 0006 Arquivamento do legado C++: adr/0006-arquivamento-legado-cpp.md
