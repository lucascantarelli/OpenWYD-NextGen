# Dev topology — hot-reload of tmServer against a Postgres (guidelines §4.4).
# For the full multi-service stack use docker-compose.yaml.
#
# Lê o MESMO `./.env` da raiz (o compose carrega o arquivo sozinho; o shell vence).
# Só a senha do Postgres se aplica aqui: este recorte sobe o tmserver com `go run`
# SEM `-dbserver` e SEM `-content`, então os overlays `W2PP_*_EDITING` não valem
# neste arquivo — com eles ligados o boot falha ("-teleport-editing requires -dbserver").
# Sem catálogo o mundo sobe SEM NPCs (aviso no log): é recorte de desenvolvimento.
# Para exercitar o jogo use `docker compose -f docker-compose.yaml up -d tmserver`.
services:
  tmserver:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app                 # hot reload of source
      - go-cache:/go/pkg/mod   # module cache
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "run", "./tmserver/cmd/tmserver"]
    ports:
      - "8281:8281"            # TMSrv client port (config-ops topology)
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dev}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
volumes:
  go-cache:
