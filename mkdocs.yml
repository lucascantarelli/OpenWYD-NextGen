site_name: WYD2 — Documentação do Projeto
site_description: Documentação para usuários, moderadores, administradores, desenvolvedores, arquitetos e engenheiros do servidor WYD2 em Rust.
site_author: Dolorestec WYD2
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Tema escuro
    - scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Tema claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

# Links para fora de docs/ (ex.: roadmap-rust/, wyd-portal/) são herança do
# repo e não são páginas do site. Ignorados aqui; o gate de links internos
# continua via `mkdocs build --strict` para tudo dentro de docs/.
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: ignore

