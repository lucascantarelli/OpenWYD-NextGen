# Teste de regra do Prometheus (FASE-12-1): dispara e resolve sem esperar tempo real.
#
# Roda com: `promtool test rules monitoring/prometheus/alerts.test.yml`
# (ou `make monitoring-rules`, que usa a imagem oficial do Prometheus).
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: "servidor fora do ar dispara e resolve"
    input_series:
      - series: 'up{job="wyd-server",instance="tmserver:9898"}'
        values: '0x12'   # 12 minutos de up=0
      # A recuperação é coberta pelo segundo cenário (job do gateway); repetir `up`
      # aqui duplicava a série no mesmo teste e mascarava o primeiro.
    alert_rule_test:
      - eval_time: 10m
        alertname: WydServidorForaDoAr
        exp_alerts:
          - exp_labels:
              severity: critical
              job: wyd-server
              instance: tmserver:9898
            exp_annotations:
              summary: "scrape do servidor de jogo falhando"
              runbook: "docs/rust/06-observabilidade-runbooks.md#wydservidorforadoar"

  - interval: 1m
    name: "gateway fora do ar dispara"
    input_series:
      - series: 'up{job="wyd-gateway",instance="gateway:7600"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: WydGatewayForaDoAr
        exp_alerts:
          - exp_labels:
              severity: critical
              job: wyd-gateway
              instance: gateway:7600
            exp_annotations:
              summary: "scrape do gateway falhando (portal responde 502)"
              runbook: "docs/rust/06-observabilidade-runbooks.md#wydgatewayforadoar"

  - interval: 1m
    name: "tick P99 acima de 40% do orçamento"
    input_series:
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="5000.0"}'
        values: '0+0x20'
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="25000.0"}'
        values: '0+60x20'
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="+Inf"}'
        values: '0+60x20'
      # Orçamento real do processo (20 Hz = 50 000 µs).
      - series: 'wyd_tick_budget_microseconds{canal="1",job="wyd-server"}'
        values: '50000x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: WydTickP99Alto
        exp_alerts:
          - exp_labels:
              severity: warning
              canal: "1"
            exp_annotations:
              summary: "P99 do tick acima de 40% do orçamento (WYD_TICK_HZ)"
              runbook: "docs/rust/06-observabilidade-runbooks.md#wydtickp99alto"

  - interval: 1m
    name: "pacotes recusados acima de 10%"
    input_series:
      - series: 'wyd_packets_total'
        values: '0+100x15'
      - series: 'wyd_packets_rejected_total{reason="rate"}'
        values: '0+20x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: WydPacotesRecusados
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "mais de 10% dos pacotes recusados (rate limit/IP/tamanho)"
              runbook: "docs/rust/06-observabilidade-runbooks.md#wydpacotesrecusados"

  - interval: 1m
    name: "tick acima de 100% do orçamento dispara"
    input_series:
      # P99 cai no bucket de 100 ms contra orçamento de 50 ms → 200% do orçamento.
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="5000"}'
        values: '0+0x10'
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="25000"}'
        values: '0+0x10'
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="50000"}'
        values: '0+0x10'
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="100000"}'
        values: '0+60x10'
      - series: 'wyd_tick_duration_microseconds_bucket{canal="1",job="wyd-server",le="+Inf"}'
        values: '0+60x10'
      - series: 'wyd_tick_budget_microseconds{canal="1",job="wyd-server"}'
        values: '50000x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: WydTickAcimaDoOrcamento
        exp_alerts:
          - exp_labels:
              severity: critical
              canal: "1"
            exp_annotations:
              summary: "P99 do tick passou do orçamento do processo (WYD_TICK_HZ)"
              runbook: "docs/rust/06-observabilidade-runbooks.md#wydtickacimadooçamento"

  - interval: 1m
    name: "motor no ar sem tick dispara"
    input_series:
      - series: 'wyd_ticks_total{job="wyd-server",canal="1"}'
        values: '0+0x12'
      - series: 'up{job="wyd-server",instance="tmserver:9898"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: WydMotorSemTick
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "servidor no ar sem processar ticks"
              runbook: "docs/rust/06-observabilidade-runbooks.md#wydmotorsemtick"
