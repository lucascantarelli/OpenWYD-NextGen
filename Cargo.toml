[workspace]
resolver = "2"
members = [
  "crates/wyd-protocol",
  "crates/wyd-core",
  "crates/wyd-net",
  "crates/wyd-db",
  "crates/wyd-admin",
  "crates/wyd-server",
  "crates/wyd-sim",
  "crates/wyd-launcher",
  "crates/wyd-bots",
  "apps/launcher-ui",
]

# Release otimizado (QA-03, ADR-0017): LTO thin, uma unidade de codegen e strip.
# Medido em 2026-11-08: wyd-launcher 323.072 → 223.232 bytes (ver docs/rust/02-execucao.md).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
