[workspace]
resolver = "2"
members = [
  "crates/wyd-protocol",
  "crates/wyd-core",
  "crates/wyd-net",
  "crates/wyd-db",
  "crates/wyd-admin",
  "crates/wyd-server",
  "crates/wyd-sim",
  "crates/wyd-launcher",
  "crates/wyd-bots",
  "apps/launcher-ui",
]

# Release otimizado (QA-03, ADR-0017): LTO thin, uma unidade de codegen e strip.
# Medido em 2026-11-08: wyd-launcher 323.072 → 223.232 bytes (ver docs/rust/02-execucao.md).

# Fonte única de versão (DEVOPS-10): as crates herdam com `version.workspace = true` e o
# portal espelha este número no package.json. `node tools/dev/check-versao.mjs` (make
# versao-check) falha se divergirem, e a tag `vX.Y.Z` é o que identifica a imagem.
[workspace.package]
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
