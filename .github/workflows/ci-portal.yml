name: CI portal

# O portal rodava tsc → vitest → next build em sequência num job só. São independentes: em matriz,
# os três terminam no tempo do mais lento (o build), não na soma.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: portal — ${{ matrix.nome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: typecheck (tsc --noEmit)
            comando: npm run typecheck
          - nome: testes (vitest)
            comando: npm run test -- --reporter=dot
          - nome: build (next build)
            comando: npm run build
    defaults:
      run:
        working-directory: wyd-portal
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - name: ${{ matrix.nome }}
        run: ${{ matrix.comando }}
