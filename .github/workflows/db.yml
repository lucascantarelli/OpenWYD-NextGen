name: DB

# CI-02: o job que aplica as migrations do zero num Postgres real, roda o `down`
# do baseline com verificação por catálogo e executa os testes de integração do
# store. É o único lugar em que `store.Migrate` roda contra um banco limpo a cada
# PR — um `down` quebrado ou uma migration que só funciona no banco de dev
# aparece aqui, não no deploy.
#
# Sem passos opcionais: todo `run` é obrigatório e falha o job se falhar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrações, down e testes de banco
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      W2PP_TEST_DSN: postgres://postgres:dev@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compilar
        run: go build ./...

      - name: Down do baseline (0001 up + down, verificação por catálogo)
        run: go test -tags=integration ./internal/store/ -run TestBaselineDown -count=1 -v

      # O pacote inteiro inclui TestMigrateAndSaveAccount, que roda store.Migrate
      # (0001..0005 + seeds) num schema vazio e depois testa idempotência.
      - name: Testes de integração do store
        run: go test -tags=integration ./internal/store/ -count=1
