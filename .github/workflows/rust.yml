name: Rust

# Gate do repositório. Cada job abaixo é o ponto de CI de uma issue DEVOPS:
#   gate            → DEVOPS-04 (paridade com `make check`, item por item)
#   sistema/portal  → DEVOPS-07 (banco real sem skip silencioso + suíte do portal)
#   monitoring      → DEVOPS-04 (regra de alerta quebrada não passa)
#   bench           → DEVOPS-05 (uma compilação de bench, não duas)
#   compose-surface → DEVOPS-03 (superfície de produção do compose)
#   actionlint      → higiene dos próprios workflows
# Imagens, supply-chain e release ficam em workflows próprios (images.yml,
# supply-chain.yml, release.yml) para não pagar build de imagem em todo push de código.
#
# Regra de ouro: nada aqui pode ser `continue-on-error`. Se o gate não pode falhar, ele não é gate.

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "Makefile"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "roadmap-rust/**"
      - "docker/**"
      - "docker-compose*.yml"
      - "tools/**"
      - "wyd-portal/**"
      # Qualquer workflow, não só este: editar o deploy sem passar pelo actionlint é buraco.
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main, develop]
    # PR de documentação/roadmap não paga o pipeline inteiro (DEVOPS-05); o job `gate`
    # continua rodando para eles via `push`.
    paths-ignore:
      - "docs/**"
      - "roadmap-rust/**"
      - "*.md"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  # Em PR, run novo cancela o anterior. Em `main`/`develop` NÃO cancela: todo commit que
  # vira base de release precisa de gate completo (antes o cancel abria buraco em `main`).
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gate:
    name: gate (fmt/clippy/build/test + conteúdo)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          # O workspace inclui `apps/launcher-ui` (Tauri): sem GTK/WebKit o `glib-sys` falha.
          tauri: "true"

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy (warnings são erro, inclusive testes e benches)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build do workspace
        run: cargo build --workspace

      # `--all-targets` inclui integração, doc-tests e os alvos de bench (compile-only).
      - name: Testes do workspace
        run: cargo test --workspace

      # Os quatro scripts abaixo eram só locais; com DEVOPS-04 eles passam a derrubar o CI.
      - name: Migrations (ordem, FK, down)
        run: node tools/content/check-migrations.mjs

      - name: Status de issue (índice × painel × arquivo)
        run: node tools/content/check-issue-status.mjs

      - name: Links e contagem de crates
        run: node tools/dev/check-docs-consistency.mjs

      - name: Skills (frontmatter, tamanho, caminhos)
        run: node tools/dev/check-skills.mjs

      - name: Versão única (Cargo workspace × portal)
        run: node tools/dev/check-versao.mjs

      - name: Testes das ferramentas de dev
        # Glob: o Node 22 do runner não aceita diretório em `--test` (Node 26 aceita).
        run: node --test apps/tools/test/*.test.mjs

  portal:
    name: portal (tsc + vitest + next build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: wyd-portal
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-setup

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm run test -- --reporter=dot

      - name: Build (next build, rotas e standalone)
        run: npm run build

  sistema:
    name: sistema (Postgres real, zero SKIP)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wyd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Mesmo runner do boot (ADR-0024). `WYD_TEST_REQUIRED=1` transforma o antigo
      # "SKIP: ... não executado" em falha: sem banco, o job fica vermelho (DEVOPS-07).
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wyd
      WYD_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/wyd
      WYD_TEST_REQUIRED: "1"
      MIGRATIONS_DIR: crates/wyd-db/migrations
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup

      - name: Aplicar a série de migrations
        run: cargo run -p wyd-admin --bin wyd-gateway -- --migrate

      # `-j 1`: os testes de sistema compartilham o mesmo banco por job.
      - name: Testes do servidor (login, selchar, mundo, cena)
        # `-j 1` limita a compilação; `--test-threads=1` é o que serializa os testes. Sem isso eles
        # disputam o mesmo banco e o mesmo teto de sessão por canal (o teto=1 via "sessão viva").
        run: cargo test -p wyd-server --all-targets -j 1 -- --nocapture --test-threads=1

      - name: Testes do admin (seed, grants)
        run: cargo test -p wyd-admin --all-targets -j 1 -- --nocapture --test-threads=1

  monitoring:
    name: monitoramento (promtool + amtool)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: promtool check config
        run: docker run --rm -v "$PWD/docker/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 check config prometheus.yml

      - name: promtool check rules
        run: docker run --rm -v "$PWD/docker/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml

      - name: promtool test rules (disparo e resolução)
        run: docker run --rm -v "$PWD/docker/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts.test.yml

      - name: Render da config do Alertmanager + template do Slack
        run: node tools/dev/check-alertas.mjs

  compose-surface:
    name: compose (dev, prod e superfície)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # O compose exige estas variáveis (`${VAR:?}`) e o `config` não lê `.env` no CI:
      # valores fixos, sem segredo, só para validar a sintaxe e a interpolação.
      TAG: ci
      POSTGRES_PASSWORD: ci-nao-e-segredo
      WEB_API_TOKEN: ci-nao-e-segredo
      SESSION_SECRET: ci-nao-e-segredo
    steps:
      - uses: actions/checkout@v5

      - name: Contrato de superfície de produção (DEVOPS-03)
        run: node tools/dev/check-compose-hardening.mjs

      - name: Compose base + dev
        run: docker compose config --quiet

      - name: Compose de produção
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Compose de produção com .env montado
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.prod-env.yml config --quiet

  bench:
    name: benches (compila uma vez e mede)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          cache-key-extra: bench
          cache-all-crates: "true"
          tauri: "true"

      # Uma compilação: o `--no-run` cobre o gate de compilação e o `bench-gate` roda o
      # binário já compilado. Antes eram duas (`--no-run` + o do gate) — C4 da auditoria.
      - name: Compilar benches
        run: cargo bench --workspace --no-run

      - name: Régua de regressão por cenário (baseline p50, tolerância 2,5–3×)
        run: node tools/dev/bench-gate.mjs

      - name: Limites do transporte (wyd-net)
        run: cargo bench -p wyd-net --bench limits

  actionlint:
    name: actionlint (os próprios workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validar workflows e actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
