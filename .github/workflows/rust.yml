name: Rust

# Orquestrador do gate. Cada grupo é um workflow reutilizável (`.github/workflows/ci-*.yml`) e
# roda em paralelo; dentro de cada grupo há matrizes, então o total de jobs simultâneos é o que
# dita o tempo de parede, não a soma dos passos.
#
#   conteudo → 6 checagens de conteúdo (migrations, issues, docs, skills, versão, ferramentas)
#   rust     → fmt, clippy, build+test e sistema (matriz server/admin)
#   portal   → matriz typecheck / vitest / next build
#   infra    → matriz compose (3 modos), promtool (3) e Alertmanager + actionlint
#
# O benchmark NÃO está aqui: é o job mais caro (~4,3 min medidos) e vive em `bench.yml`, com
# gatilho por caminho e agenda. O `supply-chain.yml` cobre advisory/licença e cobertura.
#
# Imagens, supply-chain e release ficam em workflows próprios (images.yml, supply-chain.yml,
# release.yml) para não pagar build de imagem em todo push de código.
#
# Regra de ouro: nada aqui pode ser `continue-on-error`. Se o gate não pode falhar, ele não é gate.
# O job `gate` agrega os grupos: é este o check obrigatório de branch protection.

on:
  # Disparo manual: útil para medir o pipeline e reproduzir um run sem commit novo.
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "Makefile"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "roadmap-rust/**"
      - "docker/**"
      - "docker-compose*.yml"
      - "tools/**"
      - "wyd-portal/**"
      # Qualquer workflow, não só este: editar o deploy sem passar pelo actionlint é buraco.
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main, develop]
    # Sem `paths-ignore` aqui de propósito: `gate` é check obrigatório de branch protection, e um
    # PR que não dispara o workflow nunca satisfaz o check — o merge de documentação ficaria
    # travado para sempre. Com o gate em ~2,5 min, o custo de rodar em PR de doc é aceitável;
    # o que não roda em PR é o bench (workflow próprio) e o supply-chain (agenda).

permissions:
  contents: read

concurrency:
  # Em PR, run novo cancela o anterior. Em `main`/`develop` NÃO cancela: todo commit que vira base
  # de release precisa de gate completo (antes o cancel abria buraco em `main`).
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conteudo:
    name: conteúdo
    uses: ./.github/workflows/ci-content.yml

  rust:
    name: rust
    uses: ./.github/workflows/ci-rust.yml

  portal:
    name: portal
    uses: ./.github/workflows/ci-portal.yml

  infra:
    name: infra
    uses: ./.github/workflows/ci-infra.yml

  gate:
    name: gate (agrega os grupos)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [conteudo, rust, portal, infra]
    # `always()` é obrigatório: sem ele o gate fica `skipped` quando um grupo falha e o check
    # obrigatório nunca fica vermelho.
    if: always()
    steps:
      - name: Exigir todos os grupos verdes
        run: |
          falhou=0
          for par in "conteudo:${{ needs.conteudo.result }}" \
                     "rust:${{ needs.rust.result }}" \
                     "portal:${{ needs.portal.result }}" \
                     "infra:${{ needs.infra.result }}"; do
            nome="${par%%:*}"; resultado="${par##*:}"
            echo "$nome = $resultado"
            [ "$resultado" = "success" ] || falhou=1
          done
          if [ "$falhou" != "0" ]; then
            echo "::error::pelo menos um grupo falhou — veja o job correspondente acima"
            exit 1
          fi
          echo "todos os grupos verdes"

  notify:
    name: aviso no Slack (falha)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [gate]
    if: failure()
    steps:
      # O segredo é opcional: sem `SLACK_CI_WEBHOOK` o passo não roda e o gate continua sendo a
      # fonte de verdade. Criar o webhook: docs/rust/10-devops-ci.md §11.
      - name: Avisar falha no canal de CI
        if: env.SLACK_CI_WEBHOOK != ''
        env:
          SLACK_CI_WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_CI_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: ":x: *CI falhou* em `${{ github.ref_name }}` (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run ${{ github.run_id }}>) — `${{ github.event.head_commit.message || github.event.pull_request.title }}`"
