name: Rust

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "Makefile"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "roadmap-rust/**"
      - "docker/**"
      - "tools/dev/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt/clippy/build/test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Consistência de README/AGENTS e crates (PROC-13)
        run: node tools/dev/check-docs-consistency.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # Unitários, integração, doc-tests e alvos de bench compilados.
      - run: cargo test --workspace --all-targets

  seed-boot:
    name: seed do staff no boot
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wyd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Mesmo runner do boot (ADR-0024): `--migrate` aplica a série e sai. O CI não
      # mantém parsing próprio de `-- migrate:up/down`.
      - name: Aplicar a série de migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wyd
          MIGRATIONS_DIR: crates/wyd-db/migrations
        run: cargo run -p wyd-admin --bin wyd-gateway -- --migrate
      - name: Teste de boot com WYD_SEED_STAFF=0
        env:
          WYD_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wyd
        run: cargo test -p wyd-admin --test sistema_seed -- --nocapture

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validar workflows do GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  bench:
    name: benches compilam e medem
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --workspace --no-run
      # Mede os cenários (IA de NPC ≤ 10% do tick, ADR-0016; ECS ≤ 50%, GAME-02)
      # e falha em regressão contra o baseline declarado por cenário.
      - run: node tools/dev/bench-gate.mjs
      - run: cargo bench -p wyd-net --bench limits

  release:
    name: release + imagem mínima
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      # Distroless non-root, builder multi-stage (ADR-0017).
      - run: docker build -f docker/Dockerfile.launcher -t wyd/launcher:ci .
      - run: docker image inspect --format 'wyd/launcher size={{.Size}} bytes' wyd/launcher:ci
      - run: docker build --check -f docker/Dockerfile.portal .

  supply-chain:
    name: audit/deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
