name: Rust

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "Makefile"
      - "docker/**"
      - "tools/dev/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt/clippy/build/test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # Unitários, integração, doc-tests e alvos de bench compilados.
      - run: cargo test --workspace --all-targets

  bench:
    name: benches compilam e medem
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --workspace --no-run
      # Mede os cenários (IA de NPC ≤ 10% do tick, ADR-0016; ECS ≤ 50%, FASE-03-2)
      # e falha em regressão contra o baseline declarado por cenário.
      - run: node tools/dev/bench-gate.mjs
      - run: cargo bench -p wyd-net --bench limits

  release:
    name: release + imagem mínima
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      # Distroless non-root, builder multi-stage (ADR-0017).
      - run: docker build -f docker/Dockerfile.launcher -t wyd/launcher:ci .
      - run: docker image inspect --format 'wyd/launcher size={{.Size}} bytes' wyd/launcher:ci
      - run: docker build --check -f docker/Dockerfile.portal .

  supply-chain:
    name: audit/deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
