name: CI

# Orquestrador: decide o que mudou e delega para os workflows reutilizáveis
# (`_go.yml`, `_portal.yml`). Nenhum job repete `checkout` + `setup-go` fora do
# que precisa — antes eram 5 jobs com a mesma preparação.
#
# O job `changes` roda **sempre**: um PR só de documentação continua tendo um
# check que reporta, sem deixar status obrigatório pendente para sempre.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Um run por ref; cancela os supersedidos para economizar minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Roda em todo push/PR, inclusive mudança só de documentação: um segredo pode
  # entrar por qualquer arquivo. O checkout limpo evita .env/.next locais; a
  # allowlist do .gitleaks.toml cobre apenas material não versionado.
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinado pelo módulo: o Go verifica o checksum antes de compilar, sem
      # baixar um binário de release sem conferência.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0

      - name: Scan tracked tree
        run: $(go env GOPATH)/bin/gitleaks dir . --config .gitleaks.toml --redact --no-banner --max-target-megabytes 5

  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.filter.outputs.go }}
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@v5

      # Filtro de caminho nativo do runner: `paths:` no gatilho do workflow
      # deixaria o status obrigatório pendente em PR que não tocasse o filtro.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/*.proto'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'internal/migrations/**'
              - 'tmserver/content/**'
              - 'scripts/**'
              - 'Makefile'
              - 'docker-compose*.yaml'
              - 'Dockerfile'
              - '.github/workflows/_go.yml'
            portal:
              - 'portal/**'
              - '.github/workflows/_portal.yml'

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/_go.yml

  portal:
    name: Portal
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    uses: ./.github/workflows/_portal.yml
