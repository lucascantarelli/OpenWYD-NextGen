name: Bench

# A régua de performance em workflow próprio (DEVOPS-05/DEVOPS-11).
#
# Medido em 2026-11-13: `bench` é o job mais caro do gate (~4,3 min com cache quente; 5 min frio)
# porque `cargo bench --workspace --no-run` compila o workspace no perfil de bench. Preso ao gate,
# ele ditava o tempo de parede de TODO push. Aqui ele roda quando pode haver regressão (crates de
# engine/sim/transporte, lockfile ou makefile) e semanalmente como sentinela de flakiness.
#
# Continua sendo gate quando roda: `bench-gate.mjs` falha se o cenário passar da tolerância.

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/wyd-core/**"
      - "crates/wyd-sim/**"
      - "crates/wyd-net/**"
      - "crates/wyd-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/dev/bench-gate.mjs"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "0 7 * * 1" # segunda, 07:00 UTC — uma hora depois do supply-chain
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  bench:
    name: benches (compila uma vez e mede)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          cache-key-extra: bench
          cache-all-crates: "true"
          tauri: "true"
      # Uma compilação: o `--no-run` cobre o gate de compilação e o `bench-gate` roda o binário já
      # compilado.
      - name: Compilar benches
        run: cargo bench --workspace --no-run
      - name: Régua de regressão por cenário (baseline p50, tolerância 2,5–3×)
        run: node tools/dev/bench-gate.mjs
      - name: Limites do transporte (wyd-net)
        run: cargo bench -p wyd-net --bench limits
