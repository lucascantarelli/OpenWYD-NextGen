name: Deploy local

# DEVOPS-09 — CD local: CI verde em `develop` reconstrói e sobe a stack na máquina do dono.
#
# Travas (docs/rust/10-devops-ci.md §9):
#   - NENHUM trigger de `pull_request`: o runner tem Docker, `.env` e `client/` no host, então
#     executar código de PR ali é execução arbitrária na máquina;
#   - `permissions: contents: read`: o runner não escreve no repositório;
#   - segredos só no `.env` do host, nunca em `secrets` do GitHub;
#   - sentinela `tmp/teste-humano.flag`: em teste manual, o deploy aborta com aviso em vez de
#     reiniciar a stack (AGENTS.md §0);
#   - nunca `down -v`, nunca `DROP`, nunca toca em `client/`.

on:
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Um deploy por vez; não cancela o que já está rodando (derrubar no meio deixa stack pela metade).
  group: deploy-local
  cancel-in-progress: false

jobs:
  deploy:
    name: rebuild + up + provas
    # Runner de repositório com labels `self-hosted,wyd-local` na máquina de desenvolvimento.
    runs-on: [self-hosted, wyd-local]
    environment: local
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop')
    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # O PATH depende de como o runner foi iniciado: se `C:\Windows\System32` vier antes do Git, o
      # `shell: bash` cai no bash do WSL e o passo morre em "anexar o disco ... ERROR_PATH_NOT_FOUND"
      # (visto no run 43414518376, com o runner subindo por tarefa agendada). Prependar o Git Bash
      # resolve a ambiguidade para todos os passos seguintes.
      - name: Git Bash no PATH (o runner pode resolver para o bash do WSL)
        shell: powershell
        run: |
          $git = 'C:\Program Files\Git\bin'
          if (-not (Test-Path (Join-Path $git 'bash.exe'))) { throw "Git Bash nao encontrado em $git" }
          $git | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "bash resolvido para $git"

      - name: Sentinela de teste humano
        id: sentinela
        shell: bash
        env:
          ARQUIVO_ENV: ${{ vars.WYD_ENV_FILE }}
        run: |
          # O flag vive no projeto do host (é lá que o teste humano acontece), não no checkout do
          # runner: o diretório do `.env` é a referência de onde procurar.
          if [ -n "$ARQUIVO_ENV" ]; then projeto="$(dirname "$ARQUIVO_ENV")"; else projeto=""; fi
          if [ -n "$projeto" ] && [ -f "$projeto/tmp/teste-humano.flag" ]; then
            echo "pulado=true" >> "$GITHUB_OUTPUT"
            echo "::warning::tmp/teste-humano.flag presente em $projeto — deploy NÃO executado (teste humano em andamento). Remova o arquivo para liberar."
          else
            echo "pulado=false" >> "$GITHUB_OUTPUT"
          fi

      - name: .env do host (segredos nunca saem da máquina)
        if: steps.sentinela.outputs.pulado == 'false'
        shell: bash
        env:
          # Nome deliberadamente diferente de `WYD_ENV_FILE`: o compose interpola essa variável
          # dentro do container (o override de dev aponta para /run/wyd/env) e um caminho do
          # Windows ali vira "definido mas ilegível" no boot do gateway.
          ARQUIVO_ENV: ${{ vars.WYD_ENV_FILE }}
        run: |
          if [ -z "$ARQUIVO_ENV" ] || [ ! -f "$ARQUIVO_ENV" ]; then
            echo "::error::defina a variável de repositório WYD_ENV_FILE com o caminho do .env do host (recebido: '$ARQUIVO_ENV')"
            exit 1
          fi
          # O override de dev monta `./.env` em /run/wyd/env; o checkout do runner não tem o
          # arquivo (gitignored), então ele é copiado do host antes de qualquer build.
          cp "$ARQUIVO_ENV" .env
          echo "ok: .env do host copiado para o workspace"

      - name: Rebuild das imagens
        if: steps.sentinela.outputs.pulado == 'false'
        shell: bash
        run: docker compose build 2>&1 | tee deploy-build.log

      - name: Subir a stack (sem down -v, sem reset de volume)
        if: steps.sentinela.outputs.pulado == 'false'
        shell: bash
        run: docker compose up -d --wait --wait-timeout 240 2>&1 | tee -a deploy-build.log

      - name: Provas de contrato do deploy
        if: steps.sentinela.outputs.pulado == 'false'
        shell: bash
        run: node tools/dev/deploy-provas.mjs 2>&1 | tee deploy-provas.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-local-${{ github.run_id }}
          path: |
            deploy-build.log
            deploy-provas.log
          retention-days: 14
          if-no-files-found: warn
