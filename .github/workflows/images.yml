name: Imagens

# DEVOPS-06 — as QUATRO imagens, com proveniência real, smoke e scan bloqueante.
#
# Antes: só o launcher era construído (`release`), gateway/server nunca, portal só com
# `docker build --check` (lint de Dockerfile). Um Dockerfile quebrado passava meses sem sinal —
# foi o que aconteceu com `include_str!` do launcher (DEVOPS-01).

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "docker-compose*.yml"
      - "wyd-portal/**"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "docker/**"
      - "Cargo.lock"
      - "wyd-portal/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Proveniência honesta: `vX.Y.Z` quando é tag, senão `0.0.0-<sha curto>`. O commit é sempre
  # o do run — nada de `0.1.0`/`unknown` fixos nas labels OCI (B6 da auditoria).
  WYD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.sha) }}
  WYD_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: build+smoke+scan (${{ matrix.imagem }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagem: launcher
            dockerfile: docker/Dockerfile.launcher
            smoke: "--help"
            # `--help` do launcher sai 2 por contrato; o smoke aceita 0 ou 2.
            smoke_exit: "0 2"
          - imagem: gateway
            dockerfile: docker/Dockerfile.gateway
            smoke: "--help"
            smoke_exit: "0"
          - imagem: server
            dockerfile: docker/Dockerfile.server
            smoke: "--help"
            smoke_exit: "0"
          - imagem: portal
            dockerfile: docker/Dockerfile.portal
            # Sem backend no job: o smoke prova entrypoint/bundle, não /api/health.
            smoke: ""
            smoke_exit: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (cache gha entre execuções)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: wyd/${{ matrix.imagem }}:ci
          build-args: |
            WYD_VERSION=${{ env.WYD_VERSION }}
            WYD_COMMIT=${{ env.WYD_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}

      - name: Labels de proveniência conferem com o run
        run: |
          labels="$(docker image inspect --format '{{json .Config.Labels}}' wyd/${{ matrix.imagem }}:ci)"
          echo "$labels"
          echo "$labels" | grep -q "${WYD_COMMIT}" || { echo "FALHOU: label sem WYD_COMMIT do run"; exit 1; }
          echo "$labels" | grep -q "${WYD_VERSION}" || { echo "FALHOU: label sem WYD_VERSION do run"; exit 1; }

      - name: Tamanho da imagem
        run: docker image inspect --format 'imagem=${{ matrix.imagem }} size={{.Size}} bytes' wyd/${{ matrix.imagem }}:ci

      - name: Smoke do artefato
        if: matrix.smoke != ''
        run: |
          set +e
          docker run --rm wyd/${{ matrix.imagem }}:ci ${{ matrix.smoke }}
          codigo=$?
          set -e
          echo "smoke exit=$codigo (aceitos: ${{ matrix.smoke_exit }})"
          case " ${{ matrix.smoke_exit }} " in *" $codigo "*) exit 0 ;; *) echo "FALHOU: exit inesperado"; exit 1 ;; esac

      # Scan bloqueante em CRITICAL. Exceção só em `.trivyignore`, com data e motivo.
      - name: Scan de vulnerabilidade (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wyd/${{ matrix.imagem }}:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: SBOM (CycloneDX) como artefato
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wyd/${{ matrix.imagem }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.imagem }}.cdx.json
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.imagem }}
          path: sbom-${{ matrix.imagem }}.cdx.json
          retention-days: 30
