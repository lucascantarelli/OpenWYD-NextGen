name: Portal

# Workflow reutilizável do portal, chamado por `ci.yml` só quando `portal/**`
# muda (path filter lá, não aqui — assim o check `CI / changes` sempre reporta).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  portal:
    name: Typecheck, test & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Inclui o teste de rota (middleware + fronteira de autorização): é o gate
      # que reprova se uma rota admin sair do `matcher` do middleware.
      - name: Test
        run: npm test

      # Build standalone usado pelo portal/Dockerfile.
      - name: Build
        run: npm run build

      - uses: docker/setup-buildx-action@v4

      # Mesmo contexto/arquivo do compose; sem push, só smoke test de build.
      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: portal/Dockerfile
          push: false
          tags: w2pp-portal:ci
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
