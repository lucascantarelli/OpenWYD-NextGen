# Configuração do gitleaks para o repositório.
#
# O scan roda no CI sobre o checkout limpo (sem .env local nem build do portal)
# e localmente via `make gate`. As allowlists abaixo cobrem apenas material que
# não é versionado ou valores de desenvolvimento já públicos; nenhuma regra do
# gitleaks é desligada.
title = "OpenWYD"
[extend]
useDefault = true

[allowlist]
description = "Material local/gerado e defaults de desenvolvimento documentados."
paths = [
  '''(^|/)\.env($|\.)''',
  '''(^|/)portal/\.next/''',
  '''(^|/)\.tools/''',
  '''(^|/)client/''',
  '''(^|/)tmp/''',
  '''(^|/)tmserver/content/_legacy/''',
]
regexes = [
  '''dev-only-portal-session-secret-32-chars''',
  '''openwyd-dev-crossover''',
  '''postgres://[^:]+:dev(-[a-z]+)?@''',
]
