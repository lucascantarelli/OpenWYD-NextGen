[package]
name = "wyd-launcher"
version = "0.1.0"
edition = "2021"
description = "Launcher/patcher moderno do WYD (hash, patch, bootstrap)"
publish = false

[[bin]]
name = "wyd-launcher"
path = "src/main.rs"

[lib]
name = "wyd_launcher"
path = "src/lib.rs"

[dependencies]
# Tela de conexão: o launcher usa o MESMO renderizador da CLI headless, sem texto duplicado.
wyd-bots = { path = "../wyd-bots" }

# Testes por tipo (docs/arquitetura/testes.md): alvos explícitos porque o Cargo
# não descobre arquivos em subpastas de tests/.

[[test]]
name = "contrato_identidade"
path = "tests/contrato/identidade.rs"

[[test]]
name = "golden_serverlist_paridade"
path = "tests/golden/serverlist_paridade.rs"
