[package]
name = "wyd-net"
version = "0.1.0"
edition = "2021"
description = "Transporte async do WYD (tokio/io_uring, zero-copy)"
publish = false

[lib]
name = "wyd_net"
path = "src/lib.rs"

[features]
# Contadores por pacote/porta ficam fora do build default: o `fetch_add` no balde custa
# ~8,8 ns sobre um consumo de 2,7 ns (medido na FASE-06-1). O daemon liga `metrics`;
# o bench default mede o caminho sem instrumentação.
default = []
metrics = []

[dependencies]
wyd-protocol = { path = "../wyd-protocol", version = "0.1.0" }

# Bench sem dependência nova (`criterion` exige rede/ADR).
[[bench]]
name = "limits"
harness = false
test = false
