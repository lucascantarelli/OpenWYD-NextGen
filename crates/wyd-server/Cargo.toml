[package]
name = "wyd-server"
version = "0.1.0"
edition = "2021"
description = "Monolito Hot Path do WYD (tmserver): CPSock, status HTTP e metricas"
publish = false

# Raiz de composição do monólito (ADR-0022 §1): só ela conhece todas as libs —
# `wyd-net` continua sem saber o que é Postgres e `wyd-db` continua sem saber o que é socket.
[lib]
name = "wyd_server"
path = "src/lib.rs"

[[bin]]
name = "wyd-server"
path = "src/main.rs"

[dependencies]
wyd-protocol = { path = "../wyd-protocol", version = "0.1.0" }
# FASE-03-7: o processo do canal roda o motor — tick, ECS e grade saem do crate de engine.
wyd-core = { path = "../wyd-core", version = "0.1.0" }
# `metrics`: o daemon publica o fragmento de rede no `/metrics` (FASE-06-1).
wyd-net = { path = "../wyd-net", version = "0.1.0", features = ["metrics"] }
wyd-db = { path = "../wyd-db", version = "0.1.0" }
# FASE-10: curva e máquina de EXP puras (`ExpTable`/`grant_exp`), sem I/O no tick.
wyd-sim = { path = "../wyd-sim" }
# Reaproveita o transporte HTTP/1.1 já provado (ADR-0008/0022), sem reimplementar contrato.
wyd-admin = { path = "../wyd-admin", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# Guarda de contrato: lê os dashboards JSON do monitoramento (`tests/monitoramento_contrato.rs`).
serde_json = "1"

# Prova viva da quest do Campo: o teste conecta pelo mesmo protocolo do cliente
# (`tests/campo_vivo.rs`), criando o personagem pelo `_MSG_CreateCharacter`.
wyd-bots = { path = "../wyd-bots", version = "0.1.0" }

# Bench do serviço (não só da lib): tick com mundo vazio e com 1 000 entidades.
[[bench]]
name = "tick"
harness = false
test = false
