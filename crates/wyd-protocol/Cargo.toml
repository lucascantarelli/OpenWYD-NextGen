[package]
name = "wyd-protocol"
version = "0.1.0"
edition = "2021"
description = "Contratos de wire/cliente do WYD (CPSock, offsets explicitos)"
publish = false

[lib]
name = "wyd_protocol"
path = "src/lib.rs"

# Testes por tipo (docs/arquitetura/testes.md): alvos explícitos porque o Cargo
# não descobre arquivos em subpastas de tests/.

[[test]]
name = "golden_pacotes"
path = "tests/golden/pacotes.rs"

[[test]]
name = "integracao_roundtrip"
path = "tests/integracao/roundtrip.rs"
