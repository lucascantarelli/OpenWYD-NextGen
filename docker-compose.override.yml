# Override de DEV — carregado automaticamente com `docker compose up`.
# Publica portas no host, monta código-fonte (hot reload do portal) e logs.
# NUNCA copiar este arquivo para produção: use docker-compose.prod.yml.

services:
  db:
    # Publicado SÓ em loopback (como no arquivado): este Postgres é de dev e
    # a senha é a do compose. Ferramentas do host (VS Code/DBeaver) usam ele.
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"

  gateway:
    # Só em loopback: o gateway é backend do portal, não serviço público.
    # Em prod (docker-compose.prod.yml) não há publicação — só a rede `wyd`.
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-7600}:7600"   # contrato admin (ADR-0008/0022)
    environment:
      # Dev: o seed do staff roda no boot do gateway (credencial default do `.env`).
      # Trocar em qualquer ambiente que não seja a máquina local.
      WYD_SEED_STAFF: ${WYD_SEED_STAFF:-1}
      PORTAL_ADMIN_USER: ${PORTAL_ADMIN_USER:-admin}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-troque-aqui-dev}

  server:
    # Canal 1 (normal): o cliente disca 8281 fixo no IP da célula do .bin, então a
    # publicação é por IP, não só por porta. O status `serv00.htm` sai no :80 deste
    # canal — é a resposta que popula a coluna Canal nos dois canais.
    # Dois conjuntos de endereço, de propósito: o cliente **já aberto** pode estar com o
    # `serverlist.bin` antigo (IPs de LAN) enquanto o arquivo em disco já foi regenerado
    # para loopback. Publicar nos dois evita exigir restart do cliente para ele achar o canal.
    # `127.0.0.1`/`127.0.0.2` são endereços de loopback do host (`WYD_CANAL*_IP` guarda o da LAN).
    ports:
      - "${WYD_CANAL1_IP:-192.168.100.3}:8281:8281"
      # Sonda UDP de status na mesma 8281: sem ela o cliente não dá o canal como
      # acessível e o Conectar nem abre o TCP (4 bytes, resposta em eco).
      - "${WYD_CANAL1_IP:-192.168.100.3}:8281:8281/udp"
      - "${WYD_CANAL1_IP:-192.168.100.3}:80:8080"
      - "127.0.0.1:8281:8281"
      - "127.0.0.1:8281:8281/udp"
      - "127.0.0.1:80:8080"

  server-canal-2:
    # Canal 2 (verde/novato): MESMA imagem e MESMO banco, outro IP — o cliente só
    # diferencia canal por host, nunca por porta (`docs/cliente/formatos.md` §4).
    image: wyd/server:${TAG:-dev}
    container_name: wyd-canal-2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-wyd}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-wyd}"
      WYD_SERVER_CHANNEL: "2"
      WYD_SERVER_CPSOCK_BIND: 0.0.0.0:8281
      WYD_SERVER_STATUS_BIND: 0.0.0.0:8080
      WYD_SERVER_METRICS_BIND: 0.0.0.0:9898
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WYD_CANAL2_IP:-192.168.100.4}:8281:8281"
      - "${WYD_CANAL2_IP:-192.168.100.4}:8281:8281/udp"
      - "127.0.0.2:8281:8281"
      - "127.0.0.2:8281:8281/udp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/wyd-server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    # Mesma retenção do canal 1: o login manual deste canal não some por rotação.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - wyd

  portal:
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:3000"   # UI de administração
    environment:
      NODE_ENV: development
    volumes:
      # Auditoria em arquivo fora do container (ver AUDIT_LOG_DIR).
      - portal-audit:/var/log/wyd-portal

volumes:
  portal-audit:
    name: wyd-portal-audit
