# Overlay de mTLS para os links gRPC internos (Fase 7). Aplique sobre a base
# DEPOIS de gerar os certificados de desenvolvimento (`make certs`):
#
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml \
#                  -f docker-compose.mtls.yaml up -d --build
#
# O certificado de servidor carrega SANs com os nomes de serviço do compose
# (`openwyd-dbserver`, `openwyd-binserver`, `openwyd-webserver`), então o tmServer
# verifica cada peer pela authority do dial, sem `W2PP_TLS_SERVER_NAME`. Os
# servidores exigem certificado de cliente válido (RequireAndVerifyClientCert).
services:
  openwyd-dbserver:
    environment:
      W2PP_TLS_CERT: /certs/server.crt
      W2PP_TLS_KEY: /certs/server.key
      W2PP_TLS_CA: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro

  openwyd-binserver:
    environment:
      W2PP_TLS_CERT: /certs/server.crt
      W2PP_TLS_KEY: /certs/server.key
      W2PP_TLS_CA: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro

  openwyd-webserver:
    environment:
      W2PP_TLS_CERT: /certs/server.crt
      W2PP_TLS_KEY: /certs/server.key
      W2PP_TLS_CA: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro

  # Os dois canais usam o MESMO certificado de cliente: o dial deles é para os
  # três servidores acima, e o overlay vale para qualquer canal.
  openwyd-nextgen1-tmsrv:
    environment:
      W2PP_TLS_CERT: /certs/client.crt
      W2PP_TLS_KEY: /certs/client.key
      W2PP_TLS_CA: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro

  openwyd-nextgen2-tmsrv:
    environment:
      W2PP_TLS_CERT: /certs/client.crt
      W2PP_TLS_KEY: /certs/client.key
      W2PP_TLS_CA: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
