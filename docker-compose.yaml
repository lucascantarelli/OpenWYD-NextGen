# Full microservice topology (migration-plan.md §3.5): tmServer (CPSock edge) →
# dbServer + binServer (gRPC) → PostgreSQL. Production images are built from the
# multi-stage ./Dockerfile, one binary per service.
#
#   docker compose up --build
#
# Internal links run insecure here for out-of-the-box bring-up. To enable mTLS,
# run `make certs` then add the overlay:
#   docker compose -f docker-compose.yaml -f docker-compose.mtls.yaml up --build
#
# Secrets (DB DSN) come from the environment, never hardcoded in code.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Publicado só em loopback para ferramentas do host (VS Code/DBeaver/pgAdmin).
    # Nunca use 0.0.0.0: este Postgres é de desenvolvimento e a senha é a do compose.
    ports:
      - "127.0.0.1:5432:5432"

  dbserver:
    build:
      context: .
      args:
        SVC: dbserver
    environment:
      W2PP_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-dev}@db:5432/postgres
    command: ["serve", "-addr", ":7514"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "7514"

  binserver:
    build:
      context: .
      args:
        SVC: binserver
    command: ["-addr", ":3000"]
    expose:
      - "3000"

  webserver:
    build:
      context: .
      args:
        SVC: webserver
    environment:
      W2PP_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-dev}@db:5432/postgres
      W2PP_CONTENT: /Release
      # One-time web client login codes (IssuePlayCode); empty keeps them off.
      # Same value as the portal's PLAY_CODE_SECRET, at least 32 characters.
      W2PP_PLAY_CODE_SECRET: ${W2PP_PLAY_CODE_SECRET:-}
    command: ["-addr", ":7600", "-content", "/Release"]
    volumes:
      - ./Release:/Release:ro   # merchant NPC templates for ListMerchantTemplates
    depends_on:
      db:
        condition: service_healthy
    # Published so host-side tools (grpcurl, probes) can reach the web-api; the
    # portal talks to it over the compose network as webserver:7600.
    ports:
      - "7600:7600"

  # Sidecar de logs (issue 40): ÚNICO processo com o socket do Docker, montado
  # read-only. Serve /status e /logs/<serviço> na rede interna do compose; o
  # portal autentica a sessão e repassa. Nenhuma operação de escrita, sem exec,
  # sem acesso a arquivos — e a porta não é publicada.
  logpipe:
    build:
      context: .
      dockerfile: logpipe/Dockerfile
    image: openwyd-logpipe:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # O socket pertence a root:root (0660) no Docker Desktop; a imagem distroless
    # roda como nonroot, então o grupo 0 é o que dá leitura sem rodar como root.
    group_add:
      - "0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "7788"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/logpipe", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      WEB_API_ADDR: webserver:7600
      W2PP_CONTENT: /Release
      # Logs ao vivo pelo sidecar; sem isto o BFF tenta o Docker CLI do host.
      LOG_PIPE_URL: http://logpipe:7788
      # Dev-only: sobrescreva no ambiente em qualquer deploy real (>=32 chars).
      SESSION_SECRET: ${W2PP_PORTAL_SESSION_SECRET:-dev-only-portal-session-secret-32-chars}
      AUDIT_LOG_DIR: /var/log/wyd-portal
    volumes:
      - ./Release:/Release:ro   # ItemList.csv (preços) lido pelo portal
      - ./dist:/dist:ro         # world-atlas.json / mapas gerados (issue 41)
      - portal-audit:/var/log/wyd-portal   # trilha de auditoria (ndjson)
    depends_on:
      webserver:
        condition: service_started
      logpipe:
        condition: service_started
    ports:
      - "3000:3000"            # UI de administração
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  tmserver:
    build:
      context: .
      args:
        SVC: tmserver
    command:
      - "-addr"
      - ":8281"
      - "-dbserver"
      - "dbserver:7514"
      - "-binserver"
      - "binserver:3000"
      - "-content"
      - "/Release"
      - "-status-addr"
      - ":80"
      - "-client-version"
      - "12000"
    depends_on:
      dbserver:
        condition: service_started
      binserver:
        condition: service_started
    # Switches for the moderator overlays (README/test recipes assume they can be
    # exported). Every one defaults to "false" = read strictly from Release/, so this
    # passthrough changes nothing unless you export it. The NPC spawn catalogue is
    # NOT an overlay: npc_definition is the single source of spawn blocks (issue 57).
    #   W2PP_RATES_EDITING=true docker compose up -d tmserver
    environment:
      W2PP_MOB_STAT_EDITING: "${W2PP_MOB_STAT_EDITING:-false}"
      W2PP_ITEM_EFFECT_EDITING: "${W2PP_ITEM_EFFECT_EDITING:-false}"
      W2PP_RATES_EDITING: "${W2PP_RATES_EDITING:-false}"
      W2PP_DROP_CONFIG_EDITING: "${W2PP_DROP_CONFIG_EDITING:-false}"
      W2PP_TELEPORT_EDITING: "${W2PP_TELEPORT_EDITING:-false}"
      W2PP_MOB_CARRY_EDITING: "${W2PP_MOB_CARRY_EDITING:-false}"
    volumes:
      - ./Release:/Release:ro   # content tree (rates/catalogs/maps), validated at boot
    ports:
      - "8281:8281"            # TMSrv CPSock client edge (game)
      - "80:80"                # channel-status HTTP (serv00.htm), real WYD uses :80

volumes:
  pgdata:
  portal-audit:

# Pin an explicit subnet so the stack comes up even when Docker's auto address
# pool is exhausted (leaked IPAM state after many network create/remove cycles).
# A daemon restart clears the leak; this keeps local dev unblocked meanwhile.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
