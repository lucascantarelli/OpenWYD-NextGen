# ─────────────────────────────────────────────────────────────────────────────
# Stack OpenWYD — arquivo BASE.
#
# Aqui ficam apenas definições de produção: imagem, comando, dependências reais
# (healthcheck), volumes e configuração. Portas publicadas e ajustes de
# desenvolvimento moram em `docker-compose.override.yaml`, que o Compose carrega
# automaticamente com `docker compose up`. Overlays opcionais:
#
#   docker compose up -d                                  # base + override (dev)
#   docker compose -f docker-compose.yaml up -d           # só a base (sem portas)
#   docker compose -f docker-compose.yaml \
#                  -f docker-compose.override.yaml \
#                  -f docker-compose.mtls.yaml up -d      # base + dev + mTLS
#
# Padrão de nomes: o serviço, o container e a imagem usam o MESMO nome, para não
# existir "qual container é esse?" no `docker ps`:
#
#   openwyd-postgres           banco (upstream postgres:17-alpine)
#   openwyd-db-roles           one-shot: roles DDL/DML/RO (DB-01)
#   openwyd-dbserver           persistência gRPC 7514
#   openwyd-binserver          billing gRPC 3000
#   openwyd-webserver          web-api gRPC 7600
#   openwyd-logpipe            sidecar de logs (socket do Docker, read-only)
#   openwyd-portal             UI Next.js :3000
#   openwyd-nextgen1-tmsrv     canal 1 (ServerIndex 0) — CPSock :8281
#   openwyd-nextgen2-tmsrv     canal 2 (ServerIndex 1) — CPSock :8282
#   openwyd-prometheus         série temporal (perfil monitoring)
#   openwyd-grafana            dashboards (perfil monitoring)
#   openwyd-node-exporter      métricas do host (perfil monitoring)
#   openwyd-mkdocs             site de documentação (perfil docs)
#
# O `name:` fixa o projeto: a rede continua `openwyd_default` e os volumes
# `openwyd_*`, que é o que scripts e testes já usam.
name: openwyd

services:
  # ─────────────────────────────────────────────────────────────── persistência
  openwyd-postgres:
    image: postgres:17-alpine
    container_name: openwyd-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # DB-01: um único passo com superusuário, antes dos serviços. Cria/atualiza
  # openwyd_migrator (DDL), openwyd_app (DML) e openwyd_ro (SELECT) e transfere a
  # posse dos objetos. Idempotente: roda a cada `up` e não muda nada no segundo.
  openwyd-db-roles:
    image: postgres:17-alpine
    container_name: openwyd-db-roles
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev}
      OPENWYD_MIGRATOR_PASSWORD: ${OPENWYD_MIGRATOR_PASSWORD:-dev-migrator}
      OPENWYD_APP_PASSWORD: ${OPENWYD_APP_PASSWORD:-dev-app}
      OPENWYD_RO_PASSWORD: ${OPENWYD_RO_PASSWORD:-dev-ro}
    volumes:
      - ./scripts/db-roles.sql:/db-roles.sql:ro
    entrypoint:
      - "psql"
      - "-h"
      - "openwyd-postgres"
      - "-U"
      - "postgres"
      - "-d"
      - "postgres"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/db-roles.sql"
    depends_on:
      openwyd-postgres:
        condition: service_healthy
    restart: "no"

  # ────────────────────────────────────────────────────── serviços Go internos
  openwyd-dbserver:
    image: openwyd-dbserver:latest
    container_name: openwyd-dbserver
    build:
      context: .
      args:
        SVC: dbserver
    environment:
      # Aplicação nunca conecta como superusuário: DML apenas (DB-01).
      W2PP_DB_DSN: postgres://openwyd_app:${OPENWYD_APP_PASSWORD:-dev-app}@openwyd-postgres:5432/postgres
      # DDL/migrations usam a role migrator, que é a dona dos objetos.
      W2PP_DB_MIGRATE_DSN: postgres://openwyd_migrator:${OPENWYD_MIGRATOR_PASSWORD:-dev-migrator}@openwyd-postgres:5432/postgres
      # Chave HMAC do token de troca de canal (/srv): a MESMA nos dois canais e
      # aqui (canais.md §8.1.2). Vazia desativa a troca in-game.
      W2PP_CROSSOVER_KEY: "${W2PP_CROSSOVER_KEY:-openwyd-dev-crossover}"
    command: ["serve", "-addr", ":7514"]
    depends_on:
      openwyd-postgres:
        condition: service_healthy
      openwyd-db-roles:
        condition: service_completed_successfully
    healthcheck:
      # distroless não tem shell: o próprio binário consulta /healthz e sai.
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
      - "7514"
    restart: unless-stopped

  openwyd-binserver:
    image: openwyd-binserver:latest
    container_name: openwyd-binserver
    build:
      context: .
      args:
        SVC: binserver
    command: ["-addr", ":3000"]
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    expose:
      - "3000"
    restart: unless-stopped

  openwyd-webserver:
    image: openwyd-webserver:latest
    container_name: openwyd-webserver
    build:
      context: .
      args:
        SVC: webserver
    environment:
      W2PP_DB_DSN: postgres://openwyd_app:${OPENWYD_APP_PASSWORD:-dev-app}@openwyd-postgres:5432/postgres
      W2PP_DB_MIGRATE_DSN: postgres://openwyd_migrator:${OPENWYD_MIGRATOR_PASSWORD:-dev-migrator}@openwyd-postgres:5432/postgres
      W2PP_CONTENT: /content
      # Códigos de login de uso único do cliente web (IssuePlayCode); vazio os
      # mantém desligados. Mesmo valor do PLAY_CODE_SECRET do portal, >= 32 chars.
      W2PP_PLAY_CODE_SECRET: ${W2PP_PLAY_CODE_SECRET:-}
    command: ["-addr", ":7600", "-content", "/content"]
    volumes:
      - ./tmserver/content:/content:ro   # conteúdo: taxas e templates merchant
    depends_on:
      openwyd-postgres:
        condition: service_healthy
      openwyd-db-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
      - "7600"
    restart: unless-stopped

  # Sidecar de logs (issue 40): ÚNICO processo com o socket do Docker, montado
  # read-only. Serve /status e /logs/<serviço> na rede interna do compose; o
  # portal autentica a sessão e repassa. Nenhuma operação de escrita, sem exec,
  # sem acesso a arquivos — e a porta não é publicada.
  openwyd-logpipe:
    image: openwyd-logpipe:latest
    container_name: openwyd-logpipe
    build:
      context: .
      dockerfile: logpipe/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # O socket pertence a root:root (0660) no Docker Desktop; a imagem distroless
    # roda como nonroot, então o grupo 0 é o que dá leitura sem rodar como root.
    group_add:
      - "0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "7788"
    healthcheck:
      test: ["CMD", "/logpipe", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  openwyd-portal:
    image: openwyd-portal:latest
    container_name: openwyd-portal
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      WEB_API_ADDR: openwyd-webserver:7600
      W2PP_CONTENT: /content
      # Logs ao vivo pelo sidecar; sem isto o BFF tenta o Docker CLI do host.
      LOG_PIPE_URL: http://openwyd-logpipe:7788
      # Dev-only: sobrescreva no ambiente em qualquer deploy real (>=32 chars).
      SESSION_SECRET: ${W2PP_PORTAL_SESSION_SECRET:-dev-only-portal-session-secret-32-chars}
      AUDIT_LOG_DIR: /var/log/wyd-portal
    volumes:
      - ./tmserver/content:/content:ro   # ItemList.csv opcional (preços) lido pelo portal
      - ./dist:/dist:ro         # world-atlas.json / mapas gerados (issue 41)
      - portal-audit:/var/log/wyd-portal   # trilha de auditoria (ndjson)
    depends_on:
      openwyd-webserver:
        condition: service_healthy
      openwyd-logpipe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────── canais / jogo
  # Canal 1 (ServerIndex 0). Cada canal é um processo: ele tem o próprio mundo em
  # memória, mas compartilha save/guilda pelo openwyd-dbserver. O canal verde
  # (novato) é fixo por W2PP_NOVICE_CHANNEL, não gira por calendário.
  openwyd-nextgen1-tmsrv:
    image: openwyd-nextgen1-tmsrv:latest
    container_name: openwyd-nextgen1-tmsrv
    build:
      context: .
      args:
        SVC: tmserver
    command:
      - "-addr"
      - ":8281"
      - "-dbserver"
      - "openwyd-dbserver:7514"
      - "-binserver"
      - "openwyd-binserver:3000"
      - "-content"
      - "/content"
      - "-status-addr"
      - ":80"
      - "-client-version"
      - "12000"
      - "-server-index"
      - "0"
    depends_on:
      openwyd-dbserver:
        condition: service_healthy
      openwyd-binserver:
        condition: service_healthy
    # Chaves dos overlays do moderador (receitas de README/teste supõem que dá
    # para exportá-las). Todas começam em "false" = lê estritamente da árvore de
    # conteúdo, então este repasse não muda nada sem export. O catálogo de spawn de
    # NPC NÃO é overlay: npc_definition é a única fonte dos blocos de spawn.
    #   W2PP_RATES_EDITING=true docker compose up -d openwyd-nextgen1-tmsrv
    environment:
      W2PP_MOB_STAT_EDITING: "${W2PP_MOB_STAT_EDITING:-false}"
      W2PP_ITEM_EFFECT_EDITING: "${W2PP_ITEM_EFFECT_EDITING:-false}"
      W2PP_RATES_EDITING: "${W2PP_RATES_EDITING:-false}"
      W2PP_DROP_CONFIG_EDITING: "${W2PP_DROP_CONFIG_EDITING:-false}"
      W2PP_TELEPORT_EDITING: "${W2PP_TELEPORT_EDITING:-false}"
      W2PP_MOB_CARRY_EDITING: "${W2PP_MOB_CARRY_EDITING:-false}"
      # Canal verde (novato) é FIXO, como em produção: W2PP_NOVICE_CHANNEL é o
      # número do canal (1-based) que roda o evento newbie e recusa PvP. Cada
      # instância compara com o seu W2PP_SERVER_INDEX, então o mesmo valor vai
      # para todos os containers. 0 desliga o canal verde.
      W2PP_NOVICE_CHANNEL: "${W2PP_NOVICE_CHANNEL:-1}"
      # Token de troca de canal (/srv): a mesma chave no dbServer e no outro canal.
      W2PP_CROSSOVER_KEY: "${W2PP_CROSSOVER_KEY:-openwyd-dev-crossover}"
    volumes:
      - ./tmserver/content:/content:ro   # conteúdo (taxas/mapas), validado no boot
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      # O boot carrega catálogo do banco + 10k NPCs: ~10 s medidos.
      start_period: 45s
    expose:
      - "8281"
      - "80"
    restart: unless-stopped

  # Canal 2 (ServerIndex 1) — mesmo binário, mesmo dbServer, mesmo conteúdo
  # read-only. É o destino da troca de canal (`/srv 2`): a cidadania é
  # ServerIndex+1 e o id de guilda carrega o índice nos bits altos.
  openwyd-nextgen2-tmsrv:
    image: openwyd-nextgen2-tmsrv:latest
    container_name: openwyd-nextgen2-tmsrv
    build:
      context: .
      args:
        SVC: tmserver
    command:
      - "-addr"
      - ":8282"
      - "-dbserver"
      - "openwyd-dbserver:7514"
      - "-binserver"
      - "openwyd-binserver:3000"
      - "-content"
      - "/content"
      - "-status-addr"
      - ":8080"
      - "-client-version"
      - "12000"
      - "-server-index"
      - "1"
    depends_on:
      openwyd-dbserver:
        condition: service_healthy
      openwyd-binserver:
        condition: service_healthy
    environment:
      W2PP_MOB_STAT_EDITING: "${W2PP_MOB_STAT_EDITING:-false}"
      W2PP_ITEM_EFFECT_EDITING: "${W2PP_ITEM_EFFECT_EDITING:-false}"
      W2PP_RATES_EDITING: "${W2PP_RATES_EDITING:-false}"
      W2PP_DROP_CONFIG_EDITING: "${W2PP_DROP_CONFIG_EDITING:-false}"
      W2PP_TELEPORT_EDITING: "${W2PP_TELEPORT_EDITING:-false}"
      W2PP_MOB_CARRY_EDITING: "${W2PP_MOB_CARRY_EDITING:-false}"
      W2PP_NOVICE_CHANNEL: "${W2PP_NOVICE_CHANNEL:-1}"
      W2PP_CROSSOVER_KEY: "${W2PP_CROSSOVER_KEY:-openwyd-dev-crossover}"
    volumes:
      - ./tmserver/content:/content:ro
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 45s
    expose:
      - "8282"
      - "8080"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────── monitoring
  # Perfil OPCIONAL: sem `--profile monitoring` a stack de jogo não muda.
  # Prometheus coleta os cinco alvos Go + o exportador do host; Grafana
  # provisiona o dashboard versionado de monitoring/grafana.
  #   docker compose --profile monitoring up -d
  # Não confundir com o logpipe: aqui é série temporal; o texto por requisição
  # continua vindo do logpipe para o /logs do portal.
  openwyd-prometheus:
    image: prom/prometheus:v3.5.0
    container_name: openwyd-prometheus
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  openwyd-grafana:
    image: grafana/grafana:12.2.0
    container_name: openwyd-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Troque em qualquer deploy real: o default é só de desenvolvimento.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      openwyd-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Exportador do host para o alerta de disco. Mede os sistemas de arquivos da
  # VM Linux do Docker (no Docker Desktop/Windows, NÃO o volume C:) — o limite
  # está documentado em docs/migration/config-ops.md.
  openwyd-node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: openwyd-node-exporter
    profiles: ["monitoring"]
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)($|/)"
    pid: host
    # A montagem padrão do exporter é `/:/host:ro,rslave`, mas o propagate
    # `rslave` é recusado pelo daemon do Docker Desktop ("not a shared or slave
    # mount"). `:ro` basta para ler os sistemas de arquivos da VM.
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────── docs
  # Site de documentação (DOC-01). Config, Dockerfile e conteúdo vivem em docs/;
  # o repositório é montado em /project porque o `-f docs/mkdocs.yml` é relativo a
  # ele. `serve` recarrega ao editar; o gate é `build --strict`:
  #   docker compose --profile docs up -d openwyd-mkdocs
  #   docker compose --profile docs run --rm openwyd-mkdocs build -f docs/mkdocs.yml --strict
  openwyd-mkdocs:
    image: openwyd-mkdocs:latest
    container_name: openwyd-mkdocs
    build:
      context: .
      dockerfile: docs/Dockerfile
    command: ["serve", "-f", "docs/mkdocs.yml", "-a", "0.0.0.0:8000"]
    volumes:
      - .:/project
    profiles: ["docs"]

volumes:
  pgdata:
  portal-audit:
  promdata:
  grafanadata:

# Fixa uma sub-rede explícita para a stack subir mesmo com o pool automático do
# Docker esgotado (estado de IPAM vazado após muitos ciclos de create/remove de
# rede). Reiniciar o daemon limpa o vazamento; isto mantém o dev local andando
# enquanto isso.
networks:
  default:
    name: openwyd_default
    ipam:
      config:
        - subnet: 172.28.0.0/24
